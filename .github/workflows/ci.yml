name: ci
on: [push, pull_request]
jobs:
  control-plane:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: control-plane } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: infera, POSTGRES_PASSWORD: infera, POSTGRES_DB: infera }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./... && go test ./... && go build ./...
      - name: Tests on Postgres
        run: go test -count=1 ./...
        env: { INFERA_TEST_DATABASE_URL: "postgres://infera:infera@localhost:5432/infera?sslmode=disable" }
  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo build --release && cargo test --release
