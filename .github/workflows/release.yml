# Push a tag like v0.1.0 to build the node for every desktop platform and attach it to a GitHub release,
# and publish the control-plane image to GitHub Container Registry.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  agent:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: infera-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: infera-linux-arm64 }
          - { os: macos-14,         target: aarch64-apple-darwin,      name: infera-macos-arm64 }
          - { os: macos-13,         target: x86_64-apple-darwin,       name: infera-macos-x64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: infera-windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
        working-directory: agent
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.name }}.tar.gz -C agent/target/${{ matrix.target }}/release infera
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path agent/target/${{ matrix.target }}/release/infera.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.*
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/infera-server:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/infera-server:latest
