[package]
name = "infera-agent"
version = "0.1.0"
edition = "2021"
description = "Infera node: serves AI inference from idle laptops and desktops"
license = "MIT"

[[bin]]
name = "infera"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.32"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.30", optional = true }
notify-rust = { version = "4", optional = true }
open = { version = "5", optional = true }

[features]
default = ["tray"]
tray = ["dep:tray-icon", "dep:tao", "dep:notify-rust", "dep:open"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI_Shell"] }
